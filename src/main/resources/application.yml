spring:
  application:
    name: dugout-xi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ipl_league}
    username: ${DB_USER:ipl}
    password: ${DB_PASSWORD:ipl}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema. A mismatch stops the app at startup.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Comma-separated emails made admins at registration and on every startup. After that, admins promote others
  # from the Accounts screen. Leave empty to manage admins only from the app (or the database).
  admin-emails: ${ADMIN_EMAILS:}

  jwt:
    # Must be at least 32 bytes. Set JWT_SECRET in every real environment. The default is for local development only.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-1234567890}
    expiration: 24h

  contests:
    # The smallest number of confirmed players a contest can run with. Below this it is cancelled at its start time
    # and standalone entries are refunded. Two is the floor: a single entry has no pool to split.
    minimum-players: ${CONTEST_MINIMUM_PLAYERS:2}

  jobs:
    # Everything time-driven: joining opens, unpaid places are cut off, contests lock, reminders go out.
    # The integration tests switch this off so a background run cannot change a fixture halfway through a test.
    enabled: ${JOBS_ENABLED:true}
    open-leagues-ms: 60000
    payment-cutoff-ms: 60000
    contest-start-ms: 20000        # often, because locking late could let a late pick through
    notifications-ms: 30000
    settlement-reminder-ms: 86400000

  dev-tools:
    # Admin-only shortcuts for trying the app out: pull a contest's start time forward, run the jobs on demand.
    # Never enable this on anything real.
    enabled: ${DEV_TOOLS_ENABLED:false}

  cors:
    # Where the React app runs in development.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
